# A linha 'version' no topo não é mais necessária nas versões recentes do Docker Compose e pode ser removida.

services:
  postgres-duckdb:
    # SUGESTÃO: Usar uma tag de versão específica para garantir builds consistentes.
    # A tag 'main' pode mudar a qualquer momento.
    image: pgduckdb/pgduckdb:16-main # Ou uma tag de versão estável como "16-v0.1.0"
    container_name: postgres_com_duckdb
    restart: always
    
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      
    ports:
      - "${DB_PORT:-5432}:5432"
      
    volumes:
      - pgduckdb_data:/var/lib/postgresql/data

    # SUGESTÃO: Adicionar um healthcheck para verificar se o Postgres está pronto para receber conexões.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgduckdb_data: